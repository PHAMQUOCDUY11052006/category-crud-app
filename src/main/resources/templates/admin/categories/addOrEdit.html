<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout-admin}">
<body>
<div layout:fragment="content">

    <div class="col-md-6 offset-md-3">
        <form th:action="@{/admin/categories/saveOrUpdate}" method="post" th:object="${category}">

            <div class="card shadow-sm">
                <div class="card-header"
                     th:text="${category.edit} ? 'Cap nhat Category' : 'Them moi Category'">
                    Them moi Category
                </div>

                <div class="card-body">

                    <!-- Co luu trang thai them moi / sua -->
                    <input type="hidden" th:field="*{edit}" />

                    <div class="mb-3" th:if="${category.edit}">
                        <label for="categoryId" class="form-label">Category ID:</label>
                        <input type="text" readonly="readonly" class="form-control"
                               th:field="*{categoryId}" id="categoryId" name="categoryId" />
                    </div>

                    <div class="mb-3">
                        <label for="name" class="form-label">Ten Category:</label>
                        <input type="text" class="form-control" th:field="*{name}"
                               id="name" name="name" placeholder="Nhap ten danh muc" />
                        <div th:if="${#fields.hasErrors('name')}"
                             class="text-danger small" th:errors="*{name}"></div>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <i class="fa fa-save"></i> Luu
                    </button>
                    <a th:href="@{/admin/categories/searchpaginated}" class="btn btn-secondary">
                        Huy
                    </a>
                </div>
            </div>
        </form>
    </div>

</div>
</body>
</html>
